[platformio]
default_envs = lolin32_lite
src_dir = firmware/SmartDrawerAlarm

[env:lolin32_lite]
platform = espressif32
board = lolin32_lite
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain+
lib_deps =
    h2zero/NimBLE-Arduino

; Fallback environment if the local PlatformIO installation cannot find
; lolin32_lite for some reason. Use explicitly with:
;   pio run -e esp32dev_fallback
;   pio run -e esp32dev_fallback -t upload
[env:esp32dev_fallback]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
lib_ldf_mode = chain+
lib_deps =
    h2zero/NimBLE-Arduino

